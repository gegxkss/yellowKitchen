<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YellowKitchen</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <header>
    <div class="header-text"><span>yellow</span>kitchen</div>
    <div class="menu">
      <button class="login">
        <svg class="login_icon" width="24" height="24" viewBox="0 0 24 24" fill="none"
          xmlns="http://www.w3.org/2000/svg">
          <path
            d="M12 6C13.1 6 14 6.9 14 8C14 9.1 13.1 10 12 10C10.9 10 10 9.1 10 8C10 6.9 10.9 6 12 6ZM12 16C14.7 16 17.8 17.29 18 18H12H6C6.23 17.28 9.31 16 12 16ZM12 4C9.79 4 8 5.79 8 8C8 10.21 9.79 12 12 12C14.21 12 16 10.21 16 8C16 5.79 14.21 4 12 4ZM12 14C9.33 14 4 15.34 4 18V20H20V18C20 15.34 14.67 14 12 14Z"
            fill="#9093A6" />
        </svg>
        <text>Log in</text>
      </button>

      <button class="basket">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <g clip-path="url(#clip0_28608_424)">
            <path
              d="M15.55 13C16.3 13 16.96 12.59 17.3 11.97L20.88 5.48C21.25 4.82 20.77 4 20.01 4H5.21L4.27 2H1V4H3L6.6 11.59L5.25 14.03C4.52 15.37 5.48 17 7 17H19V15H7L8.1 13H15.55ZM6.16 6H18.31L15.55 11H8.53L6.16 6ZM7 18C5.9 18 5.01 18.9 5.01 20C5.01 21.1 5.9 22 7 22C8.1 22 9 21.1 9 20C9 18.9 8.1 18 7 18ZM17 18C15.9 18 15.01 18.9 15.01 20C15.01 21.1 15.9 22 17 22C18.1 22 19 21.1 19 20C19 18.9 18.1 18 17 18Z"
              fill="#9093A6" />
          </g>
          <defs>
            <clipPath id="clip0_28608_424">
              <rect width="24" height="24" fill="white" />
            </clipPath>
            АА
          </defs>
        </svg>
        <span id="count">0</span>
      </button>

      <input type="checkbox" id="burger-checkbox" />
      <label for="burger-checkbox" class="burger"> </label>
      <div class="side-menu">
        <ul class="menu-list">
          <li><a href="#" class="menu-item">Delivery info</a></li>
          <li><a href="#" class="menu-item">About us</a></li>
          <li><a href="#" class="menu-item">Restaurants</a></li>
          <li><a href="#" class="menu-item">Specialities</a></li>
        </ul>
      </div>
    </div>
  </header>
  <div class="main-page">
    <div class="prime">
      <p class="main-text">Your Food court at home</p>
      <div class="group-buttons">
        <button class="delivery-but">
          <p class="delivery">Delivery</p>
          <p>Order in</p>
        </button>
        <button class="take-but">
          <p class="takeout">Takeout</p>
          <p>Grap and go</p>
        </button>
      </div>
    </div>
    <img class="salad" />
  </div>
  <div class="Block-restaurants">
    <div class="up-block">
      <p>Restaurants</p>
      <button class="but-show">
        show all
      </button>
    </div>
    <div class="restaurant-cards">
      <div class="slider-container">
        <div class="slider">
          <img src="fonts\images\fastfood.png" class="cards" />
          <img src="fonts\images\pasti.png" class="cards" />
          <img src="fonts\images\veg.png" class="cards" />
          <img src="fonts\images\vietname.png" class="cards" />
          <img src="fonts\images\fastfood.png" class="cards" />
          <img src="fonts\images\pasti.png" class="cards" />
          <img src="fonts\images\veg.png" class="cards" />
          <img src="fonts\images\vietname.png" class="cards" />
        </div>
        <button class="prev-button">&lt;</button>
        <button class="next-button">&gt</button>
      </div>
    </div>
  </div>
  <div class="find-rest">
    <div>
      <h2>Your nearest restaurants</h2>
      <p>Each kitchen works with its own delivery area to deliver food to you as soon as possible</p>
    </div>
    <form class="adress-box" onsubmit="return false;">
      <input type="text" placeholder="Enter delivery address" class="address-input">
      <button type="submit" class="send">send</button>
    </form>


  </div>

  <div class="Block-restaurants">
    <div class="up-block">
      <p>Specialities</p>
      <button class="but-show">
        show all
      </button>
    </div>
    <div class="restaurant-cards">
      <div class="slider-container">
        <div class="slider">
          <img src="fonts\images\bagel.png" class="specialities" />
          <img src="fonts\images\burger.png" class="specialities" />
          <img src="fonts\images\chicken.png" class="specialities" />
          <img src="fonts\images\fizh.png" class="specialities" />
          <img src="fonts\images\chips.png" class="specialities" />
          <img src="fonts\images\salads.png" class="specialities" />
          <img src="fonts\images\pizza.png" class="specialities" />
          <img src="fonts\images\pasta.png" class="specialities" />
        </div>
        <button class="prev-button">&lt;</button>
        <button class="next-button">&gt</button>
      </div>
    </div>
  </div>

  <div class="USP">
    <img src="fonts\images\lemons.png" class="lemons" />
  </div>

  <img src="fonts\images\map.png" class="map" />

  <div class="block-insta">
    <p>#YellowKitchens in instagram</p>
    <div class="photo">
      <img src="fonts\images\pic1.png" class="photos" />
      <img src="fonts\images\pic2.png" class="photos" />
      <img src="fonts\images\pic3.png" class="photos" />
      <img src="fonts\images\pic4.png" class="photos" />
    </div>
  </div>

  <script src="script.js"></script>
</body>

</html>
